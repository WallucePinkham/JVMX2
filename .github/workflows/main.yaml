on:
  push:
    branches:
    - main
    - feature/*

  pull_request:
    branches:
    - main
    - feature/*

  workflow_dispatch:

jobs:
  my_job:
    name: CI
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4 
    - name: Set up Visual Studio
      uses: microsoft/setup-msbuild@v1
      with:
        vs-version: '17.0'  # Specify the version of Visual Studio
    - name: Build boost libraries
      run: |
        dir boost_1_67_0  
        cd boost_1_67_0
        pwd
        cmd /c bootstrap.bat
        cmd /c b2.exe --build-type=complete
    - name: Build with MSBuild
      run: |
        msbuild JVMX2.sln /p:Configuration=Release /p:Platform=x86
 
