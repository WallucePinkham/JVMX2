on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main
      - feature/*
  workflow_dispatch:

jobs:
  my_job:
    name: CI
    runs-on: windows-2022
    env:
      BOOST_DIR: boost_1_78_0
      BOOST_CACHE_VERSION: v1
      VS_TOOLSET: msvc-14.3

    steps:
      - uses: actions/checkout@v4

      - name: Install VS 2022 17.8
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: 17.8   

      - name: Cache Boost build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_DIR }}/stage
            ${{ env.BOOST_DIR }}/bin.v2
          key: boost-${{ env.BOOST_DIR }}-${{ runner.os }}-${{ env.BOOST_CACHE_VERSION }}
          restore-keys: |
            boost-${{ env.BOOST_DIR }}-${{ runner.os }}-

      # - name: Diagnose
      #   shell: cmd
      #   run: |
      #     call "%VS_INSTALL%\VC\Auxiliary\Build\vcvarsall.bat" amd64_x86
      #     echo === where cl (after vcvarsall) ===
      #     where cl
      #     echo === MSVC versions installed ===
      #     dir "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" /b
      #     echo === b2 cache files ===
      #     dir "%USERPROFILE%\b2_msvc_*.cmd" 2>nul || echo "no b2 cache files"
      #     echo === b2 verbose (first 50 lines) ===
      #     pushd "%GITHUB_WORKSPACE%\%BOOST_DIR%"
      #     b2.exe toolset=msvc-14.3 address-model=32 architecture=x86 threading=multi -d2 stage 2>&1 | findstr /n "." | findstr "^[1-5][0-9]:"
      #     popd   

      - name: Build Boost
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" amd64_x86
          pushd "%GITHUB_WORKSPACE%\%BOOST_DIR%" || exit /b 1
          if not exist b2.exe call bootstrap.bat
          b2.exe toolset=msvc-14.2 address-model=32 architecture=x86 threading=multi -j%NUMBER_OF_PROCESSORS% stage
          popd   

      - name: Build with MSBuild
        shell: cmd
        run: |
          msbuild JVMX2.sln /p:Configuration=Release /p:Platform=x86 /p:BoostIncludeDir="%GITHUB_WORKSPACE%\%BOOST_DIR%" /p:BoostLibDir="%GITHUB_WORKSPACE%\%BOOST_DIR%\stage\lib"
