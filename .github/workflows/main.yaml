on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main
      - feature/*
  workflow_dispatch:

jobs:
  my_job:
    name: CI
    runs-on: windows-2022
    env:
      BOOST_DIR: boost_1_78_0
      BOOST_CACHE_VERSION: v1
      VS_TOOLSET: msvc-14.3

    steps:
      - uses: actions/checkout@v4

      - name: Install VS 2022 17.8
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: 17.8   

      - name: Cache Boost build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_DIR }}/stage
            ${{ env.BOOST_DIR }}/bin.v2
          key: boost-${{ env.BOOST_DIR }}-${{ runner.os }}-${{ env.BOOST_CACHE_VERSION }}
          restore-keys: |
            boost-${{ env.BOOST_DIR }}-${{ runner.os }}-

      - name: Diagnostics
        shell: cmd
        run: |
          echo === where cl ===
          where cl || echo "cl not on PATH"
          echo === cl version ===
          cl /Bv || echo "cl /Bv failed"
          echo === vswhere info ===
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -products * -latest -format text -property installationPath

      - name: Build Boost
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('dir /b /ad "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.3*"') do set MSVC_VER=%%i
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvarsall.bat" amd64_x86
          pushd "%GITHUB_WORKSPACE%\boost_1_78_0"
          call bootstrap.bat
          call b2.exe toolset=msvc-14.3 address-model=32 architecture=x86 threading=multi -j%NUMBER_OF_PROCESSORS% stage
          popd   

      - name: Build with MSBuild
        shell: cmd
        run: |
          msbuild JVMX2.sln /p:Configuration=Release /p:Platform=x86 /p:BoostIncludeDir="%GITHUB_WORKSPACE%\%BOOST_DIR%" /p:BoostLibDir="%GITHUB_WORKSPACE%\%BOOST_DIR%\stage\lib"
