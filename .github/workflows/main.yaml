on:
  push:
    branches:
    - main
    - feature/*

  pull_request:
    branches:
    - main
    - feature/*

  workflow_dispatch:

jobs:
  my_job:
    name: CI
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4 
    - name: Set up Visual Studio
      uses: microsoft/setup-msbuild@v1
      with:
        vs-version: '17.0'  # Specify the version of Visual Studio
    - name: set MS Dev environment
      # run: |
      #   call "C:\Program Files (x86)\Microsoft Visual Studio\2019\Community\VC\Auxiliary\Build\vcvarsall.bat" x86
      uses: ilammy/msvc-dev-cmd@v1

    - name: Cache Boost build
      uses: actions/cache@v4
      if: always()
      with:
        path: |
          boost_1_67_0/stage
          boost_1_67_0/bin.v2
        key: boost-1_67_0-${{ runner.os }}-${{ hashFiles('boost_1_67_0/**') }}
        restore-keys: |
          boost-1_67_0-${{ runner.os }}-      

    - name: Build boost libraries
      shell: cmd
      # call "%ProgramFiles(x86)%\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat" x86
      run: |
        rem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
        set VS150COMNTOOLS=%VS170COMNTOOLS%
        rem call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\vsdevcmd\ext\vcvars\vcvars140.bat"
        cd boost_1_67_0
        call bootstrap.bat
        echo Running B2...
        rem call b2.exe --with-thread --with-date_time --with-filesystem --with-exception address-model=32 architecture=x86 threading=multi link=static runtime-link=static 
        rem call b2.exe --with-thread --with-date_time --with-filesystem --with-exception --with-context --with-chrono address-model=32 architecture=x86 threading=multi 
        call b2.exe toolset=msvc address-model=32 architecture=x86 threading=multi 


    - name: Build with MSBuild
      run: |
        msbuild JVMX2.sln /p:Configuration=Release /p:Platform=x86
 
