---
name: CI
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Visual Studio
        uses: microsoft/setup-msbuild@v1
        with:
          vs-version: '17.0'  # Specify the version of Visual Studio

      - name: Build with MSBuild
        run: |
          msbuild JVMX2.sln /p:Configuration=Release
